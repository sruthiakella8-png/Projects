openapi: 3.0.3
info:
  title: MediFind Healthcare Platform API
  version: 1.0.0
  description: REST API for the MediFind healthcare platform. Provides authentication,
    patient services, healthcare provider management, diagnostics, pharmacy workflows,
    and administrative APIs. Protected endpoints use JWT Bearer authentication.
paths:
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      description: Admin dashboard statistics.
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/login/:
    post:
      operationId: admin_login_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLogin'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/admin/register/:
    post:
      operationId: admin_register_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRegister'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegister'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Public registration endpoint.

        POST /api/auth/register/
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/test-auth/:
    get:
      operationId: auth_test_auth_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Login using username and password.

        Returns:
            access
            refresh
            role
            username
            email
            phone
            is_verified
            user_id
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/diagnostics/{id}/:
    get:
      operationId: diagnostics_retrieve
      description: Returns detailed information about a diagnostic center. Access
        is restricted to the center itself or an administrator.
      summary: Get diagnostic center details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsProfile'
          description: ''
        '404':
          description: Diagnostics center not found.
  /api/diagnostics/{id}/delete/:
    delete:
      operationId: diagnostics_delete_destroy
      description: Permanently deletes a diagnostic center and its associated authentication
        account. Administrator access is required.
      summary: Delete diagnostic center
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Diagnostic center deleted successfully.
        '404':
          description: Diagnostics center not found.
  /api/diagnostics/{id}/verify/:
    patch:
      operationId: diagnostics_verify_partial_update
      description: Approves or rejects a diagnostics center after reviewing its verification
        submission. Rejection requires a rejection reason.
      summary: Approve or reject diagnostic center
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsVerification'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsVerificationResponse'
          description: ''
        '400':
          description: Invalid verification request.
        '404':
          description: Diagnostics center not found.
  /api/diagnostics/admin/list/:
    get:
      operationId: diagnostics_admin_list_list
      description: Returns diagnostics centers that have submitted verification requests.
        The optional status query parameter filters results.
      summary: List diagnostic centers for administration
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiagnosticsProfile'
          description: ''
  /api/diagnostics/dashboard/:
    get:
      operationId: diagnostics_dashboard_retrieve
      description: Returns dashboard information for the authenticated diagnostics
        center, including verification status and diagnostic test counts.
      summary: Get diagnostic center dashboard
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsDashboard'
          description: ''
  /api/diagnostics/dashboard/tests/:
    get:
      operationId: diagnostics_dashboard_tests_list
      description: GET (list) / POST (create) -> /api/diagnostics/dashboard/tests/
      tags:
      - diagnostics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiagnosticTest'
          description: ''
    post:
      operationId: diagnostics_dashboard_tests_create
      description: GET (list) / POST (create) -> /api/diagnostics/dashboard/tests/
      tags:
      - diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticTest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiagnosticTest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiagnosticTest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTest'
          description: ''
  /api/diagnostics/dashboard/tests/{id}/:
    get:
      operationId: diagnostics_dashboard_tests_retrieve
      description: Returns a specific diagnostic test belonging to the authenticated
        diagnostics center.
      summary: Get diagnostic test
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTest'
          description: ''
        '404':
          description: Diagnostic test not found.
    put:
      operationId: diagnostics_dashboard_tests_update
      description: Replaces an existing diagnostic test belonging to the authenticated
        diagnostics center.
      summary: Update diagnostic test
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticTest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiagnosticTest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiagnosticTest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTest'
          description: ''
        '404':
          description: Diagnostic test not found.
    patch:
      operationId: diagnostics_dashboard_tests_partial_update
      description: Updates selected fields of an existing diagnostic test belonging
        to the authenticated diagnostics center.
      summary: Partially update diagnostic test
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticTest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticTest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticTest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTest'
          description: ''
        '404':
          description: Diagnostic test not found.
    delete:
      operationId: diagnostics_dashboard_tests_destroy
      description: Deletes a diagnostic test belonging to the authenticated diagnostics
        center.
      summary: Delete diagnostic test
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Diagnostic test deleted successfully.
        '404':
          description: Diagnostic test not found.
  /api/diagnostics/patient/:
    get:
      operationId: diagnostics_patient_list
      description: |-
        GET /api/diagnostics/patient/

        Returns all verified and active diagnostic centers
        that are visible to patients.
      tags:
      - diagnostics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientDiagnosticsList'
          description: ''
  /api/diagnostics/patient/{id}/:
    get:
      operationId: diagnostics_patient_retrieve
      description: |-
        GET /api/diagnostics/patient/<id>/

        Returns public information about a verified and active
        diagnostic center.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - diagnostics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDiagnosticsDetail'
          description: ''
  /api/diagnostics/profile/:
    get:
      operationId: diagnostics_profile_retrieve
      description: Retrieves the profile of the authenticated diagnostics center.
      summary: Get diagnostic center profile
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsProfile'
          description: ''
    patch:
      operationId: diagnostics_profile_partial_update
      description: Updates the profile of the authenticated diagnostics center. Availability
        can only be changed after the center has been verified.
      summary: Update diagnostic center profile
      tags:
      - Diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsProfile'
          description: ''
  /api/diagnostics/profile/documents/:
    patch:
      operationId: diagnostics_profile_documents_partial_update
      description: Uploads or replaces verification documents for the authenticated
        diagnostics center.
      summary: Upload verification documents
      tags:
      - Diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsDocumentUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsDocumentUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDiagnosticsDocumentUpload'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsProfile'
          description: ''
  /api/diagnostics/profile/submit-verification/:
    post:
      operationId: diagnostics_profile_submit_verification_create
      description: Submits the authenticated diagnostics center for administrator
        verification after all required profile information and documents have been
        completed.
      summary: Submit center for verification
      tags:
      - Diagnostics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSubmitVerificationResponse'
          description: ''
        '400':
          description: Required profile information or documents are missing.
  /api/diagnostics/register/:
    post:
      operationId: diagnostics_register_create
      description: Register a diagnostics center and create its associated CustomUser
        authentication account.
      tags:
      - diagnostics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiagnosticsRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiagnosticsRegister'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsRegisterResponse'
          description: ''
        '400':
          description: Invalid registration data.
  /api/doctors/:
    get:
      operationId: doctors_list
      tags:
      - doctors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
          description: ''
  /api/doctors/{id}/:
    get:
      operationId: doctors_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - doctors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
          description: ''
  /api/doctors/{id}/delete/:
    delete:
      operationId: doctors_delete_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - doctors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/doctors/{id}/update/:
    put:
      operationId: doctors_update_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - doctors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Doctor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Doctor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Doctor'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
          description: ''
    patch:
      operationId: doctors_update_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - doctors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDoctor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDoctor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDoctor'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
          description: ''
  /api/doctors/availability/:
    patch:
      operationId: doctors_availability_partial_update
      tags:
      - doctors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/doctors/profile/:
    get:
      operationId: doctors_profile_retrieve
      tags:
      - doctors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: doctors_profile_update
      tags:
      - doctors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/patient/dashboard/:
    get:
      operationId: patient_dashboard_retrieve
      tags:
      - patient
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/admin/pharmacies/:
    get:
      operationId: pharmacy_admin_pharmacies_retrieve
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/admin/pharmacies/{pharmacy_id}/approve/:
    post:
      operationId: pharmacy_admin_pharmacies_approve_create
      parameters:
      - in: path
        name: pharmacy_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/admin/pharmacies/{pharmacy_id}/delete/:
    delete:
      operationId: pharmacy_admin_pharmacies_delete_destroy
      parameters:
      - in: path
        name: pharmacy_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/pharmacy/admin/pharmacies/{pharmacy_id}/reject/:
    post:
      operationId: pharmacy_admin_pharmacies_reject_create
      parameters:
      - in: path
        name: pharmacy_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/conversations/:
    get:
      operationId: pharmacy_conversations_retrieve
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: pharmacy_conversations_create
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/conversations/{conversation_id}/:
    get:
      operationId: pharmacy_conversations_retrieve_2
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: pharmacy_conversations_create_2
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/documents/:
    get:
      operationId: pharmacy_documents_retrieve
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: pharmacy_documents_create
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/documents/{document_id}/:
    delete:
      operationId: pharmacy_documents_destroy
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/pharmacy/login/:
    post:
      operationId: pharmacy_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - pharmacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PharmacyLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PharmacyLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyLogin'
          description: ''
  /api/pharmacy/medicines/:
    get:
      operationId: pharmacy_medicines_retrieve
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: pharmacy_medicines_create
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pharmacy/medicines/{medicine_id}/:
    get:
      operationId: pharmacy_medicines_retrieve_2
      parameters:
      - in: path
        name: medicine_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: pharmacy_medicines_update
      parameters:
      - in: path
        name: medicine_id
        schema:
          type: integer
        required: true
      tags:
      - pharmacy
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
