        center_name:
          type: string
          maxLength: 150
        certification_type:
          $ref: '#/components/schemas/CertificationTypeEnum'
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
        reviews_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        availability:
          $ref: '#/components/schemas/AvailabilityEnum'
        reports_time:
          type: string
          maxLength: 50
        total_tests:
          type: integer
          readOnly: true
        home_collection:
          type: boolean
        open_24_hours:
          type: boolean
      required:
      - center_name
      - id
      - total_tests
    PharmacyLogin:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PharmacyRegister:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
          minLength: 6
        pharmacy_name:
          type: string
          nullable: true
          maxLength: 200
        registration_number:
          type: string
          nullable: true
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 15
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
          maxLength: 100
        state:
          type: string
          nullable: true
          maxLength: 100
        pincode:
          type: string
          nullable: true
          maxLength: 10
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
      required:
      - password
      - username
    RoleEnum:
      enum:
      - user
      - doctor
      - diagnostics
      - pharmacy
      - admin
      type: string
      description: |-
        * `user` - User
        * `doctor` - Doctor
        * `diagnostics` - Diagnostics
        * `pharmacy` - Pharmacy
        * `admin` - Admin
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserCRUD:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 15
        password:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_verified:
          type: boolean
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - updated_at
      - username
    VerificationStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `rejected` - Rejected
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: Registration, login, logout, JWT authentication, and token management.
- name: Administration
  description: Administrative operations for managing users, healthcare providers,
    diagnostics centers, pharmacies, and platform workflows.
- name: Diagnostics
  description: Diagnostics-center registration, profile management, verification,
    diagnostic-test management, and patient discovery.
