components:
  schemas:
    AdminLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    AdminRegister:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 15
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - id
      - password
      - username
    AvailabilityEnum:
      enum:
      - available
      - unavailable
      type: string
      description: |-
        * `available` - Available
        * `unavailable` - Unavailable
    BlankEnum:
      enum:
      - ''
    CertificationTypeEnum:
      enum:
      - nabl
      - iso
      - other
      type: string
      description: |-
        * `nabl` - NABL Certified
        * `iso` - ISO Certified
        * `other` - Other
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    DiagnosticTest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        test_name:
          type: string
          maxLength: 255
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        report_time:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - price
      - test_name
    DiagnosticsDashboard:
